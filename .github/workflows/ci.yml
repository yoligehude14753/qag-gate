name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ tests/arch/ -v --tb=short

      - name: Run E2E tests (mock LLM)
        run: pytest tests/e2e/ -v --tb=short -k "not live"

      - name: Check coverage
        run: pytest tests/unit/ --cov=qag_gate --cov-report=term-missing --cov-fail-under=80

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff mypy
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Type check
        run: mypy src/qag_gate --ignore-missing-imports --strict-optional

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit
      - name: Bandit scan
        run: bandit -r src/ -ll
