[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qag-gate"
version = "0.1.0"
description = "Phase-aware binary evaluation framework for long-running coding agents (Claude Code, Codex, AutoGen, CrewAI, Letta)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Yuli Gao" }]
keywords = ["llm", "evaluation", "agent", "coding-agent", "claude-code", "codex", "qag", "binary-judge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "loguru>=0.7",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.28"]
all = ["qag-gate[openai,anthropic]"]
bench = [
    "qag-gate[all]",
    "pandas>=2.0",
    "scipy>=1.12",
    "numpy>=1.26",
    "streamlit>=1.35",
    "datasets>=2.18",
]
dev = [
    "qag-gate[all]",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "anyio>=4.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/yoligehude14753/qag-gate"
Documentation = "https://github.com/yoligehude14753/qag-gate/blob/main/README.md"
Repository = "https://github.com/yoligehude14753/qag-gate"
Issues = "https://github.com/yoligehude14753/qag-gate/issues"
Paper = "https://github.com/yoligehude14753/qag-gate/blob/main/docs/PAPER.md"

[tool.hatch.build.targets.wheel]
packages = ["src/qag_gate"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/qag_gate"]
omit = ["tests/*"]
