[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qag-gate"
version = "0.1.0"
description = "Phase-aware, output-type-adaptive QAG binary evaluation framework for AI agent outputs"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["llm", "evaluation", "agent", "qag", "binary-judge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "loguru>=0.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.28"]
all = ["qag-gate[openai,anthropic]"]
bench = [
    "qag-gate[all]",
    "pandas>=2.0",
    "scipy>=1.12",
    "numpy>=1.26",
    "streamlit>=1.35",
    "datasets>=2.18",
]
dev = [
    "qag-gate[all]",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "anyio>=4.0",
]

[project.urls]
Homepage = "https://github.com/yoli/qag-gate"
Documentation = "https://github.com/yoli/qag-gate/blob/main/README.md"
Repository = "https://github.com/yoli/qag-gate"

[tool.hatch.build.targets.wheel]
packages = ["src/qag_gate"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/qag_gate"]
omit = ["tests/*"]
